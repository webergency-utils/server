name: Runtime Adapters

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  node:
    name: Node suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Node adapter suite
        run: node scripts/runtime-suite.mjs

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Bun Vitest (portable + skip Node-only mocks)
        run: bun --bun ./node_modules/vitest/vitest.mjs run

      - name: Run Bun adapter suite
        run: bun scripts/runtime-suite.mjs

  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Deno adapter suite
        # Use npm ci's node_modules (manual); min-dep-age=0 avoids Deno blocking
        # freshly published workspace deps like typechecker within 24h.
        run: deno run --allow-net --allow-env --allow-read --node-modules-dir=manual --min-dep-age=0 scripts/runtime-suite.mjs
