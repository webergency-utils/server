name: Runtime Adapters

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  node:
    name: Node suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Node adapter suite with coverage
        run: npm run coverage:runtime:node

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: runtime-node
          name: runtime-node
          files: coverage/runtime-node/lcov.info
          fail_ci_if_error: true

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Bun Vitest with coverage
        run: npm run coverage:bun

      - name: Upload Bun unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-bun
          name: unit-bun
          files: coverage/lcov.info
          fail_ci_if_error: true

      # Native Bun adapter suite (JSC — c8 cannot instrument). Bun line hits come from unit-bun.
      - name: Run Bun adapter suite
        run: bun scripts/runtime-suite.mjs

  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run Deno adapter suite with coverage
        # Use npm ci's node_modules (manual); min-dep-age=0 avoids Deno blocking
        # freshly published workspace deps like typechecker within 24h.
        run: npm run coverage:runtime:deno

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: runtime-deno
          name: runtime-deno
          files: coverage/runtime-deno/lcov.info
          fail_ci_if_error: true
